name: Bug report
description: Report a reproducible defect using sanitized or synthetic data
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, real prompts, customer data, private receipts, URLs, or private paths. Use SECURITY.md for sensitive reports."
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and sanitized input shape
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
    validations:
      required: true

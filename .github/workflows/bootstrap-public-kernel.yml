name: Bootstrap public kernel

on:
  push:
    branches: [agent/ai-media-economics-audit]
    paths:
      - ".bootstrap/project.tar.gz.b64.part-*"
      - ".github/workflows/bootstrap-public-kernel.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ai-media-economics-audit
          fetch-depth: 0

      - name: Validate and decode payload
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t parts < <(find .bootstrap -maxdepth 1 -type f -name 'project.tar.gz.b64.part-*' | sort)
          test "${#parts[@]}" -eq 12
          printf '%s\n' "${parts[@]}"
          cat "${parts[@]}" > /tmp/project.tar.gz.b64
          echo "2223f0708cae67100d927c4b979304dff405f16c036d6f8481af75c20e5b3861  /tmp/project.tar.gz.b64" | sha256sum -c -
          base64 --decode /tmp/project.tar.gz.b64 > /tmp/project.tar.gz
          echo "149581cfaad9e82e3f38ec105801303b53aae20b5fc2ffb07315c35d8f86e735  /tmp/project.tar.gz" | sha256sum -c -
          tar -tzf /tmp/project.tar.gz | grep -Fx 'README.md'
          ! tar -tzf /tmp/project.tar.gz | grep -E '(^|/)\.\.(/|$)|^/|(^|/)\.git(/|$)'

      - name: Replace bootstrap tree with verified source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/project.tar.gz -C .
          test -f README.md
          test -f LICENSE
          test -f pyproject.toml
          test -f .github/workflows/ci.yml
          test ! -e .bootstrap
          test ! -e .github/workflows/bootstrap-public-kernel.yml

      - name: Verify source
        run: make check

      - name: Commit verified public kernel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: publish AI media pipeline economics audit kernel"
          git push origin HEAD:agent/ai-media-economics-audit

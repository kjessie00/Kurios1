name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Run full checks
        run: make check
      - name: CLI smoke test
        run: |
          media-economics-audit --version
          media-economics-audit validate examples/paired/baseline.jsonl --policy examples/paired/baseline-policy.json
          media-economics-audit audit examples/paired/baseline.jsonl --policy examples/paired/baseline-policy.json --out /tmp/audit --fail-on never
          media-economics-audit verify /tmp/audit/manifest.sha256

  source-snapshot:
    name: Source snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source snapshot
        run: tar --exclude=.git -czf /tmp/source-snapshot.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot-${{ github.sha }}
          path: /tmp/source-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 1

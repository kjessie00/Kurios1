name: Create ProofTally repository

on:
  push:
    branches: [agent/ai-media-economics-audit]
    paths:
      - ".github/workflows/create-prooftally-repo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Attempt repository creation with scoped GitHub token
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error \
            --output /tmp/response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/user/repos \
            --data '{"name":"prooftally","description":"Evidence-backed unit economics for AI media pipelines","private":false,"has_issues":true,"has_projects":false,"has_wiki":false,"auto_init":true}')"
          echo "repository_create_http_status=${status}"
          if [[ "${status}" != "201" ]]; then
            python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/response.json').read_text())
          print({'message': payload.get('message'), 'status': payload.get('status')})
          PY
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/response.json').read_text())
          print({'full_name': payload.get('full_name'), 'private': payload.get('private'), 'default_branch': payload.get('default_branch')})
          PY

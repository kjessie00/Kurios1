name: ProofTally repository bootstrap probe

on:
  pull_request:
    branches: [master]
    paths:
      - ".prooftally-create-trigger"

permissions:
  contents: read

jobs:
  create:
    if: github.actor == 'kjessie00' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Create the bounded public repository
        env:
          REPO_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN || secrets.GH_PAT || secrets.GITHUB_PAT || secrets.PAT || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error \
            --output /tmp/create.json \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${REPO_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/user/repos \
            --data '{"name":"prooftally","description":"Count only what you can prove — accepted-unit economics for AI media pipelines","private":false,"has_issues":true,"has_projects":false,"has_wiki":false,"auto_init":true}')"
          python - "$status" <<'PY'
          import json, sys
          from pathlib import Path
          status = sys.argv[1]
          payload = json.loads(Path('/tmp/create.json').read_text())
          safe = {
              'http_status': status,
              'message': payload.get('message'),
              'full_name': payload.get('full_name'),
              'private': payload.get('private'),
              'default_branch': payload.get('default_branch'),
          }
          print(safe)
          if status not in {'201', '422'}:
              raise SystemExit(1)
          PY
